name: Finance model workflow

on:

  schedule:
    - cron: '*2-59/5 * * * *'

  workflow_dispatch:
    inputs:
      action:
        description: "Execution action"
        required: true
        type: choice
        default: predict
        options:
          - download
          - train
          - predict
          - simulate
          - all
      config:
        description: "Model-set directory"
        required: true
        default: "model_sets/crypto"
      start:
        description: "Download start date (for example 2026-04-01)"
        required: false
        default: ""
      symbol:
        description: "Prediction symbol or all"
        required: false
        default: "all"
      prediction_time:
        description: "Prediction reference"
        required: false
        default: "latest"
      scope:
        description: "Model scope"
        required: true
        type: choice
        default: both
        options:
          - common
          - individual
          - both
      overwrite:
        description: "Overwrite existing trained models"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: finance-model-workflow
      cancel-in-progress: true
    env:
      FINANCE_ACTION: ${{ github.event_name == 'schedule' && 'predict' || inputs.action }}
      FINANCE_CONFIG: ${{ github.event_name == 'schedule' && 'model_sets/crypto' || inputs.config }}
      FINANCE_START: ${{ github.event_name == 'schedule' && '' || inputs.start }}
      FINANCE_SYMBOL: ${{ github.event_name == 'schedule' && 'all' || inputs.symbol }}
      FINANCE_PREDICTION_TIME: ${{ github.event_name == 'schedule' && 'latest' || inputs.prediction_time }}
      FINANCE_SCOPE: ${{ github.event_name == 'schedule' && 'both' || inputs.scope }}
      FINANCE_OVERWRITE: ${{ github.event_name == 'schedule' && 'false' || inputs.overwrite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Download data
        if: env.FINANCE_ACTION == 'download' || env.FINANCE_ACTION == 'all'
        run: |
          if [ -n "${{ env.FINANCE_START }}" ]; then
            python download_yfinance.py --config "${{ env.FINANCE_CONFIG }}" --start "${{ env.FINANCE_START }}"
          else
            python download_yfinance.py --config "${{ env.FINANCE_CONFIG }}"
          fi

      - name: Train models
        if: env.FINANCE_ACTION == 'train' || env.FINANCE_ACTION == 'all'
        run: |
          if [ "${{ env.FINANCE_OVERWRITE }}" = "true" ]; then
            python run_model_set.py train --config "${{ env.FINANCE_CONFIG }}" --scope "${{ env.FINANCE_SCOPE }}" --overwrite
          else
            python run_model_set.py train --config "${{ env.FINANCE_CONFIG }}" --scope "${{ env.FINANCE_SCOPE }}"
          fi

      - name: Predict
        if: env.FINANCE_ACTION == 'predict' || env.FINANCE_ACTION == 'all'
        run: |
          python run_model_set.py predict \
            --config "${{ env.FINANCE_CONFIG }}" \
            --symbol "${{ env.FINANCE_SYMBOL }}" \
            --prediction-time "${{ env.FINANCE_PREDICTION_TIME }}" \
            --scope "${{ env.FINANCE_SCOPE }}"

      - name: Simulate trades
        if: env.FINANCE_ACTION == 'simulate' || env.FINANCE_ACTION == 'all'
        run: |
          python run_model_set.py simulate \
            --config "${{ env.FINANCE_CONFIG }}" \
            --scope "${{ env.FINANCE_SCOPE }}"

      - name: Upload finance results
        if: github.event_name != 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-results-${{ github.run_id }}
          path: |
            model_sets/**/data/*.csv
            model_sets/**/models/*.joblib
            model_sets/**/evaluation.json
            model_sets/**/evaluation.csv
            model_sets/**/predictions/*.json
            model_sets/**/equity.csv
          if-no-files-found: warn
          retention-days: 30
